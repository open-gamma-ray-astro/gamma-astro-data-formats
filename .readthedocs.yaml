version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  jobs:
    install:
      - uv sync --locked --no-dev

# Select uv for virtual environment setup. The install job above syncs dependencies.
python:
  install:
    - method: uv
      command: sync

sphinx:
  configuration: source/conf.py
  fail_on_warning: true

formats:
  - pdf
